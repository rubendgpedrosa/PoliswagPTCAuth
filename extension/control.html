<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Poliswag Passport</title>
    <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
    <link rel="shortcut icon" type="image/png" href="icons/icon-32.png" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f8;
        --panel: #ffffff;
        --text: #1f2328;
        --muted: #667085;
        --line: #d8dee4;
        --ok: #137333;
        --bad: #c5221f;
        --warn: #b35c00;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17191c;
          --panel: #202328;
          --text: #e7e9ee;
          --muted: #a5adba;
          --line: #3a3f47;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 24px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .brand img {
        width: 40px;
        height: 40px;
        border-radius: 9px;
        flex: 0 0 auto;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 650;
      }
      .subtle {
        color: var(--muted);
        font-size: 13px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-width: 132px;
        justify-content: center;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel);
        padding: 7px 12px;
        font-weight: 650;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--bad);
      }
      .ok .dot { background: var(--ok); }
      .bad .dot { background: var(--bad); }
      .ok { color: var(--ok); }
      .bad { color: var(--bad); }
      .warning {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin: -4px 0 16px;
        padding: 12px 14px;
        border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--line));
        border-left: 4px solid var(--warn);
        border-radius: 8px;
        background: color-mix(in srgb, var(--warn) 12%, var(--panel));
      }
      .warning strong {
        display: block;
        margin-bottom: 2px;
      }
      .warning .hint {
        color: var(--muted);
        font-size: 13px;
        margin-top: 4px;
      }
      .warning code {
        color: var(--text);
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        text-align: right;
        white-space: pre-wrap;
      }
      [hidden] { display: none !important; }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 16px;
      }
      .metric,
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      .metric {
        padding: 14px;
        min-height: 82px;
      }
      .metric .label {
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: .04em;
      }
      .metric .value {
        margin-top: 8px;
        font-size: 26px;
        font-weight: 700;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(300px, 0.75fr);
        gap: 16px;
      }
      .panel h2 {
        margin: 0;
        padding: 13px 14px;
        border-bottom: 1px solid var(--line);
        font-size: 14px;
        font-weight: 650;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .btn {
        font: inherit;
        font-size: 12px;
        font-weight: 500;
        color: var(--muted);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 3px 10px;
        cursor: pointer;
      }
      .btn:hover {
        color: var(--text);
        border-color: var(--muted);
      }
      #activeJobs,
      #log {
        min-height: 160px;
        max-height: 420px;
        overflow: auto;
      }
      #log {
        margin: 0;
        padding: 12px 14px;
        white-space: pre-wrap;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .job {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
      }
      .job:last-child { border-bottom: 0; }
      .job-title {
        font-weight: 650;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .job-meta {
        color: var(--muted);
        font-size: 12px;
        margin-top: 3px;
      }
      .tag {
        align-self: start;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 3px 8px;
        font-size: 12px;
      }
      .tag.challenge { color: var(--warn); }
      .empty {
        color: var(--muted);
        padding: 18px 14px;
      }
      @media (max-width: 780px) {
        main { padding: 16px; }
        header,
        .warning,
        .layout { grid-template-columns: 1fr; display: grid; }
        .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .warning code { white-space: normal; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="brand">
          <img src="icons/icon-128.png" alt="Poliswag Passport" />
          <div>
            <h1>Poliswag Passport</h1>
            <div class="subtle">Keep this tab open while Dragonite is running.</div>
          </div>
        </div>
        <div id="status" class="pill bad"><span class="dot"></span><span>disconnected</span></div>
      </header>

      <section id="serverWarning" class="warning" role="status" aria-live="polite">
        <div>
          <strong id="serverWarningTitle">Server disconnected</strong>
          <span id="serverWarningText">Run Poliswag Passport before using Dragonite.</span>
          <div id="serverWarningHint" class="hint"></div>
        </div>
        <code id="startCommand">./poliswag-passport</code>
      </section>

      <section class="grid" aria-label="Session statistics">
        <div class="metric">
          <div class="label">Total</div>
          <div id="statTotal" class="value">0</div>
        </div>
        <div class="metric">
          <div class="label">Success</div>
          <div id="statSuccess" class="value">0</div>
        </div>
        <div class="metric">
          <div class="label">Failed</div>
          <div id="statFailed" class="value">0</div>
        </div>
        <div class="metric">
          <div class="label">Challenges</div>
          <div id="statChallenges" class="value">0</div>
        </div>
      </section>

      <section class="layout">
        <div class="panel">
          <h2>Active Jobs</h2>
          <div id="activeJobs"><div class="empty">No active jobs.</div></div>
        </div>
        <div class="panel">
          <h2>Recent Events <button id="clearLog" class="btn" type="button">Clear</button></h2>
          <pre id="log"></pre>
        </div>
      </section>
    </main>
    <script src="lib/pageLogic.js"></script>
    <script src="control.js"></script>
  </body>
</html>
