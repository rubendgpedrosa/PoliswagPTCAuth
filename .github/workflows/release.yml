name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-server:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: poliswag-passport-linux-amd64
            goos: linux
            goarch: amd64
            binary: poliswag-passport
            archive: tar.gz
          - name: poliswag-passport-linux-arm64
            goos: linux
            goarch: arm64
            binary: poliswag-passport
            archive: tar.gz
          - name: poliswag-passport-windows-amd64
            goos: windows
            goarch: amd64
            binary: poliswag-passport.exe
            archive: zip
          - name: poliswag-passport-macos-amd64
            goos: darwin
            goarch: amd64
            binary: poliswag-passport
            archive: tar.gz
          - name: poliswag-passport-macos-arm64
            goos: darwin
            goarch: arm64
            binary: poliswag-passport
            archive: tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: server/go.sum

      - name: Test server
        run: go test ./...
        working-directory: server

      - name: Build Poliswag Passport
        run: |
          mkdir -p ../dist
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME#v}" -o ../dist/${{ matrix.binary }} .
        working-directory: server

      - name: Package Poliswag Passport
        run: |
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip "${{ matrix.name }}.zip" "${{ matrix.binary }}"
          else
            tar -czf "${{ matrix.name }}.tar.gz" "${{ matrix.binary }}"
          fi

      - name: Upload Poliswag Passport artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}.${{ matrix.archive }}
          if-no-files-found: error

  package-extension:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test extension logic
        run: node --test --test-force-exit test/*.js
        working-directory: extension

      - name: Package extension
        run: |
          mkdir -p dist
          zip -r dist/poliswag-passport-extension.zip extension \
            -x 'extension/test/*'

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: poliswag-passport-extension
          path: dist/poliswag-passport-extension.zip
          if-no-files-found: error

  docker-image:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Image name
        id: image
        # GHCR needs a lowercase name; the repository name has capitals.
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:latest

  android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        working-directory: android
        env:
          POLISWAG_KEYSTORE_B64: ${{ secrets.POLISWAG_KEYSTORE_B64 }}
          POLISWAG_KEYSTORE_PASSWORD: ${{ secrets.POLISWAG_KEYSTORE_PASSWORD }}
          POLISWAG_KEY_ALIAS: ${{ secrets.POLISWAG_KEY_ALIAS }}
          POLISWAG_KEY_PASSWORD: ${{ secrets.POLISWAG_KEY_PASSWORD }}
        # With all four keystore secrets set, ship a signed release build. Without them,
        # ship the debug build: it installs, but every CI run signs it with a new
        # debug key, so updating needs an uninstall first.
        run: |
          export POLISWAG_VERSION_NAME="${GITHUB_REF_NAME#v}"
          mkdir -p ../dist
          if [ -n "$POLISWAG_KEYSTORE_B64" ] && [ -n "$POLISWAG_KEYSTORE_PASSWORD" ] \
             && [ -n "$POLISWAG_KEY_ALIAS" ] && [ -n "$POLISWAG_KEY_PASSWORD" ]; then
            echo "$POLISWAG_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export POLISWAG_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            ./gradlew --no-daemon testDebugUnitTest assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../dist/poliswag-passport-android.apk
          else
            ./gradlew --no-daemon testDebugUnitTest assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../dist/poliswag-passport-android.apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: poliswag-passport-android
          path: dist/poliswag-passport-android.apk
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-server
      - package-extension
      - android-apk
      - docker-image
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          # buildx leaves its own provenance/cache artifact in the run; it is not a
          # release file and download-artifact cannot always extract it.
          pattern: poliswag-passport-*

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh has no git remote to infer the repo from.
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "Run the Docker image ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME} next to Dragonite, then connect a worker to it: the browser extension (zip below) or the Android app (APK below). The binaries are an optional way to run the helper without Docker. Setup steps are in the README."
