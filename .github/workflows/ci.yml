name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: server/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test server
        run: go test ./...
        working-directory: server

      - name: Build Poliswag Passport
        run: go build -o ../poliswag-passport
        working-directory: server

      - name: Test extension logic
        run: node --test --test-force-exit test/*.js
        working-directory: extension
